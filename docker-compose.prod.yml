# Production setup: the bot behind Caddy, which serves the dashboard over HTTPS
# and renews certificates automatically.
#
#   1. Point your domain's DNS (an A record) at this server's IP address.
#   2. Set DOMAIN=your-domain.com in .env (plus the Discord settings).
#   3. Open ports 80 and 443 on the server's firewall.
#   4. docker compose -f docker-compose.prod.yml up -d --build

services:
  trailerbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - trailerbot-data:/data
    expose:
      - "8080"   # only reachable through Caddy, not directly from the internet

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - trailerbot
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates - keep this volume
      - caddy-config:/config

volumes:
  trailerbot-data:
  caddy-data:
  caddy-config:
